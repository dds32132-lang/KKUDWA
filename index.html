<!doctype html>
<html lang="th">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>ไดโนกระโดด - ตัวอย่าง</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="wrap">
		<canvas id="game" width="800" height="200"></canvas>
		<div class="stats" id="stats">
			<div class="stat-item">Score: <span id="scoreEl">0</span></div>
			<div class="stat-item">High: <span id="highScoreEl">0</span></div>
			<div class="stat-item">Session: <span id="timeEl">0s</span></div>
			<div class="stat-item">Runs: <span id="runsEl">0</span></div>
			<div class="stat-item">Total Time: <span id="totalTimeEl">0s</span></div>
		</div>
		<div class="hint">ใช้ ← / → หรือ A / D หรือคลิกซ้าย/ขวา เพื่อหลบ / กด Space/Enter หรือคลิกเพื่อเริ่มใหม่</div>
	</div>
	<script src="game.js"></script>
</body>
</html>
